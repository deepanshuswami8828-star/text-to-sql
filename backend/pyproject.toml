[project]
name = "text-to-sql-backend"
version = "1.0.0"
description = "FastAPI backend for the Text-to-SQL app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI uses function calls (File(...), Query(...)) in defaults
    "B905",  # zip() without strict=
]

[tool.ruff.lint.per-file-ignores]
# Prompt text and seed data read better as long lines.
"app/llm.py" = ["E501"]
"app/seed.py" = ["E501"]
